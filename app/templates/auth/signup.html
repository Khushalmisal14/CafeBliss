{% extends 'base.html' %}
{% block title %}Sign Up - CafeBliss{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">☕ Create Account</h2>
                    <p class="text-muted">Join CafeBliss today</p>
                </div>
                <form method="POST" action="{{ url_for('auth.signup') }}">
                    <div class="mb-3">
                        <label class="form-label fw-500">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Your name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="you@email.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="text" name="mobile" class="form-control" placeholder="10-digit mobile" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
                    </div>
                    <button type="submit" class="btn btn-cafe w-100">Create Account</button>
                </form>
                <p class="text-center mt-3 text-muted">
                    Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
