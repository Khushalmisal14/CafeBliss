{% extends 'base.html' %}
{% block title %}Verify OTP - CafeBliss{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card p-4 shadow text-center">
                <h2 class="fw-bold mb-2">📧 Verify OTP</h2>
                <p class="text-muted">We sent a 6-digit OTP to<br><strong>{{ email }}</strong></p>
                <form method="POST" action="{{ url_for('auth.verify_otp') }}">
                    <div class="mb-4">
                        <input type="text" name="otp" class="form-control form-control-lg text-center"
                               placeholder="Enter 6-digit OTP" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-cafe w-100">Verify & Continue</button>
                </form>
                <p class="text-muted mt-3 small">OTP expires in 10 minutes</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
