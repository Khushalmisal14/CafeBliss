{% extends 'base.html' %}
{% block title %}Edit Item - CafeBliss{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card p-4">
                <h4 class="fw-bold mb-4">✏️ Edit: {{ item.name }}</h4>
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Item Name</label>
                        <input type="text" name="name" class="form-control"
                               value="{{ item.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control"
                                  rows="2">{{ item.description }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" name="price" class="form-control"
                                   value="{{ item.price }}" step="0.01" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <select name="category_id" class="form-select">
                                {% for cat in categories %}
                                <option value="{{ cat.id }}"
                                    {{ 'selected' if cat.id == item.category_id }}>
                                    {{ cat.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Type</label>
                            <select name="is_veg" class="form-select">
                                <option value="true"
                                    {{ 'selected' if item.is_veg }}>🌿 Veg</option>
                                <option value="false"
                                    {{ 'selected' if not item.is_veg }}>🍖 Non-Veg</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Best Time</label>
                            <select name="time_of_day" class="form-select">
                                <option value="all"
                                    {{ 'selected' if item.time_of_day == 'all' }}>All Day</option>
                                <option value="morning"
                                    {{ 'selected' if item.time_of_day == 'morning' }}>Morning</option>
                                <option value="evening"
                                    {{ 'selected' if item.time_of_day == 'evening' }}>Evening</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Available?</label>
                            <select name="is_available" class="form-select">
                                <option value="true"
                                    {{ 'selected' if item.is_available }}>Yes</option>
                                <option value="false"
                                    {{ 'selected' if not item.is_available }}>No</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">New Image (optional)</label>
                        <input type="file" name="image" class="form-control" accept="image/*">
                        <small class="text-muted">Leave empty to keep current image.</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-cafe">Save Changes</button>
                        <a href="{{ url_for('admin.menu_list') }}"
                           class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
